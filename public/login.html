<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ruby FY — Login</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>
  <main class="login-page" id="app">
    <div class="login-logo" aria-hidden="true">💜</div>
    <h1 class="login-title">Ruby FY</h1>
    <p class="login-sub">Dashboard de Gerenciamento</p>

    <div class="login-card" role="main">
      <h2>Bem-vindo de volta</h2>
      <p>Faça login com sua conta Discord para acessar o painel de gerenciamento dos seus servidores.</p>

      <div class="error-msg" id="errorMsg" role="alert" aria-live="polite"></div>

      <a class="btn btn-discord" href="/auth/login" id="loginBtn" aria-label="Entrar com Discord">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057c.002.022.015.043.031.053a19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03z"/>
        </svg>
        Entrar com Discord
      </a>

      <p class="login-footer">
        Ao entrar, você concorda com o uso dos seus dados de servidor para fins de gerenciamento.
      </p>
    </div>
  </main>

  <script>
    // Verifica erros de autenticação na URL
    (function () {
      const params  = new URLSearchParams(window.location.search);
      const error   = params.get('auth_error');
      const success = params.get('auth_success');

      if (success) {
        window.location.href = '/servers';
        return;
      }

      const msgEl = document.getElementById('errorMsg');
      const messages = {
        access_denied:        'Acesso negado. Você cancelou o login com Discord.',
        token_exchange_failed:'Erro ao autenticar com Discord. Tente novamente.',
        user_fetch_failed:    'Não foi possível obter seus dados do Discord.',
        internal:             'Erro interno ao realizar login. Tente novamente em instantes.',
      };
      if (error && messages[error]) {
        msgEl.textContent = messages[error];
        msgEl.classList.add('show');
      } else if (error) {
        msgEl.textContent = 'Erro de autenticação. Tente novamente.';
        msgEl.classList.add('show');
      }
    })();
  </script>
</body>
</html>
